name: Test
on: [ push, pull_request, workflow_dispatch ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      checks: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache-dependency-path: go.sum

      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@latest


      - name: Generate mocks
        run: |
          cd metadataManager
          mockery
          cd ..

      - name: Install Go CTRF Reporter
        run: go install github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter@latest

      - name: Run tests
        run: go list -f '{{.Dir}}' -m | xargs -I {} go test -json {}/... --tags test | go-ctrf-json-reporter -output ctrf-report.json

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-path: './ctrf-report.json'
          pull-request: true
        #          status-check: true
        #          status-check-name: 'Test Reporter Results'
        if: always()

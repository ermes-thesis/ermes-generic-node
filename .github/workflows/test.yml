name: Test
on: [ push, pull_request, workflow_dispatch ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      checks: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: 'ermes-generic-node'

      - name: Checkout wasm pool
        uses: actions/checkout@v4
        with:
          repository: 'ermes-thesis/ermes-wasm-pool'
          token: '${{ secrets.READ_TOKEN }}'
          path: 'ermes-wasm-pool'

      - name: Install WasmEdge
        run: curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | sudo bash -s -- -p /usr/local

      - name: Verify WasmEdge installation
        run: wasmedge --version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache-dependency-path: go.sum

      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@latest

      - name: Generate mocks
        run: |
          cd ermes-generic-node
          cd metadataManager
          mockery
          cd ..
          cd db
          mockery
          cd ..
          cd caches
          mockery
          cd ..
          cd tokenDecoder
          mockery
          cd ..
          cd scheduler
          mockery
          cd ..
          cd server
          mockery
          cd ..

      - name: Install Go CTRF Reporter
        run: go install github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter@latest

      - name: Run tests
        run: |
          cd ermes-generic-node
          go list -f '{{.Dir}}' -m | xargs -I {} go test -json {}/... --tags test | go-ctrf-json-reporter -output ctrf-report.json -v

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-path: 'ermes-generic-node/ctrf-report.json'
          pull-request: true
        #          status-check: true
        #          status-check-name: 'Test Reporter Results'
        if: always()

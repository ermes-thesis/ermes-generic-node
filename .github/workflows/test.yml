name: Test
on: [ push, pull_request, workflow_dispatch ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      checks: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: 'ermes-generic-node'

      - name: Checkout ermes-common
        uses: actions/checkout@v6
        with:
          repository: 'ermes-thesis/ermes-common'
          path: 'ermes-common'

      - name: Install WasmEdge
        run: wget https://github.com/WasmEdge/WasmEdge/releases/download/0.16.3/WasmEdge-0.16.3-manylinux_2_28_x86_64.tar.gz && \
            mkdir -p WasmEdge-0.16.3-x86_64 && \
            tar -xf WasmEdge-0.16.3-manylinux_2_28_x86_64.tar.gz -C WasmEdge-0.16.3-x86_64 && \
            mkdir -p /wasmedge_libs_amd64 && \
            cp -r WasmEdge-0.16.3-x86_64/lib64/* /wasmedge_libs_amd64/ && \
            rm -rf WasmEdge-0.16.3*
    
      - name: Verify WasmEdge installation
        run: wasmedge --version

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache-dependency-path: "**/go.sum"

      - name: Install mockery
        run: go install github.com/vektra/mockery/v3@v3.6.1

      - name: Generate mocks
        run: |
          cd ermes-generic-node
          mockery

      - name: Install Go CTRF Reporter
        run: go install github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter@latest

      - name: Run tests
        run: |
          cd ermes-generic-node
          go list -f '{{.Dir}}' -m | xargs -I {} go test -json {}/... --tags test | go-ctrf-json-reporter -output ctrf-report.json -v

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          report-path: 'ermes-generic-node/ctrf-report.json'
          pull-request: true
        #          status-check: true
        #          status-check-name: 'Test Reporter Results'
        if: always()

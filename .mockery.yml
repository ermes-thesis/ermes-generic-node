all: true
force-file-write: true
formatter: goimports
log-level: info
structname: '{{.InterfaceName}}'
filename: '{{.InterfaceName}}.go'
pkgname: '{{.SrcPackageName}}_mock'
dir: 'mocks/{{.InterfaceDirRelative}}'
recursive: true
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  tokenDecoder:
  metadataManager:
  db:
  dataManager:
  caches:
  server:
  scheduler:
  github.com/ermes-thesis/ermes-wasm-pool:
    config:
      dir: 'mocks/ermes-wasm-pool/{{.InterfaceDirRelative}}'
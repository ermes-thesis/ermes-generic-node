common:
  port: 12345
  secret: "ermes-secret"

  migrationManager:
    leaderThreshold: 5
    followerThreshold: 5
    viewSize: 5
    idleTimeoutMs: 1000
    gravityConstant: 9.81

  lru:
    size: 2000
    safeLevel: 0.8

  redis:
    address: "localhost"
    port: 6379
    db: 0
    password: eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    protocol: 2

  functionsCache:
    binaryCache:
      size: 100
      ttl: 3600s
      binDir: "./functionCache"
    templateCache:
      size: 100
      ttl: 3600s
    functionRegistry:
      address: "localhost"
      port: 8080
    latestCacheTtl: 3600s

  scheduler:
    groupTokenProviderAddress: "localhost"
    groupTokenProviderPort: 8081
    wasmRuntime: "wasmtime"

  groupTokenPublicKeyPath: "./keys/public.pem"